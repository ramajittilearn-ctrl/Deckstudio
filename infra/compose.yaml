services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deckstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: deckstudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deckstudio -d deckstudio"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://deckstudio:${POSTGRES_PASSWORD}@postgres:5432/deckstudio?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://deckstudio:${POSTGRES_PASSWORD}@postgres:5432/deckstudio?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  init:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    env_file: ../.env
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://deckstudio:${POSTGRES_PASSWORD}@postgres:5432/deckstudio?schema=public
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
